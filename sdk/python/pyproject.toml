[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seven-evaluate"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Python extensions for portable Seven Agent Eval evaluations"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/seven_evaluate"]
